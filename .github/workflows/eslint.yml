# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org


name: ESLint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ESLint
        run: |
          npm install eslint@8.10.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0

      
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . --config .eslintrc.js --ext .js,.jsx,.ts,.tsx --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Check SARIF file
        if: always()
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "Files in current directory:"
          Get-ChildItem

          Write-Host "Checking SARIF file:"
          Test-Path eslint-results.sarif

          if (Test-Path eslint-results.sarif) {
            Get-Item eslint-results.sarif
          }

      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
