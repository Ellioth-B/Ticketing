<!-- Page résumant les dernières mission, les prochaine mission dispo et les directive prioritaire (refacto, test unitaire..ect) -->

<div class="order-mission">
  <div class="mission-available flex">
    <div class="mat-card">
      <h2>Mission disponible</h2>
      <mat-card>

      </mat-card>
    </div>
    @if (auth.getRole() === 'ADMIN') {
    <button (click)="toggleForm()">{{ showForm() ? 'Fermer formulaire' : 'Ajouter mission' }}</button>
    }
  </div>
  @if (auth.getRole() === 'ADMIN') {
  <button (click)="toggleForm()">{{ showForm() ? 'Fermer formulaire' : 'Ajouter mission' }}</button>
  }
</div>

<!-- Formulaire d'ajout, affiché uniquement si showForm est true -->
@if (showForm()) {
<div class="mat-card">
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Type* :</label>
      <input [formField]="missionForm.type" type="type" placeholder="Fix, Ajout, UX/UI..." />
    </div>
    <div>
      <label>Projet :</label>
      <input [formField]="missionForm.projet" type="projet" placeholder="Phenix, Vision 40..." />
    </div>
    <div>
      <label>Durée estimé :</label>
      <input [formField]="missionForm.durationDay" type="number" placeholder="0, 33, 999..." />
    </div>
    <div>
      <label>Description brève :</label>
      <input [formField]="missionForm.description" type="textarea" placeholder="Ajout d'un bouton pour..." />
    </div>
    <button type="submit">Soumettre</button>
  </form>
</div>
}

<!-- Tableau des missions proposées -->
<div class="mat-card table-mission">
  <table mat-table [dataSource]="missions()" class="mat-elevation-z8">
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Type </th>
      <td mat-cell *matCellDef="let mission"> {{mission.type}} </td>
    </ng-container>

    <ng-container matColumnDef="projet">
      <th mat-header-cell *matHeaderCellDef> Projet </th>
      <td mat-cell *matCellDef="let mission"> {{mission.projet}} </td>
    </ng-container>

    <ng-container matColumnDef="durationDay">
      <th mat-header-cell *matHeaderCellDef> Durée (jours) </th>
      <td mat-cell *matCellDef="let mission"> {{mission.durationday}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let mission"> {{mission.description}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let mission" class="flex"><button (click)="openDialog()">Ouvrir</button>
        <button (click)="deleteMission(mission.id)"><mat-icon>delete_forever</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
