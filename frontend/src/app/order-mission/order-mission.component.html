<!-- Page résumant les dernières mission, les prochaine mission dispo et les directive prioritaire (refacto, test unitaire..ect) -->

<div class="order-mission">
    <div class="mission-available flex">
        <div class="mat-card">
            <h2>Mission disponible</h2>
            <mat-card>

            </mat-card>
        </div>
        <button *ngIf="auth.getRole() === 'ADMIN'" (click)="toggleForm()">{{ showForm() ? 'Fermer formulaire' : 'Ajouter mission' }}</button>
    </div>

    <!-- Formulaire affiché uniquement si showForm est true -->
    <div *ngIf="showForm()" class="mat-card">
        <form [formGroup]="missionForm" (ngSubmit)="onSubmit()">
            <div>
                <label>Type* :</label>
                <input formControlName="type" type="type" placeholder="Fix, Ajout, UX/UI..." />
            </div>

            <div>
                <label>Projet :</label>
                <input formControlName="projet" type="projet" placeholder="Phenix, Vision 40..." />
            </div>

            <div>
                <label>Durée estimé :</label>
                <input formControlName="durationDay" type="number" placeholder="0, 33, 999..." />
            </div>

            <div>
                <label>Description brève :</label>
                <input formControlName="description" type="textarea" placeholder="Ajout d'un bouton pour..." />
            </div>

            <button type="submit">Soumettre</button>
        </form>
    </div>


    <div class="mat-card table-mission">
        <table mat-table [dataSource]="missions()" class="mat-elevation-z8">
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let mission"> {{mission.type}} </td>
            </ng-container>

            <ng-container matColumnDef="projet">
                <th mat-header-cell *matHeaderCellDef> Projet </th>
                <td mat-cell *matCellDef="let mission"> {{mission.projet}} </td>
            </ng-container>

            <ng-container matColumnDef="durationDay">
                <th mat-header-cell *matHeaderCellDef> Durée (jours) </th>
                <td mat-cell *matCellDef="let mission"> {{mission.durationday}} </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef> Description </th>
                <td mat-cell *matCellDef="let mission"> {{mission.description}} </td>
            </ng-container>

            <ng-container>
                <td><button (click)="openDialog()">Ouvrir</button></td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

        <button (click)="inc()">+</button>
        <p>{{ count() }}</p>
    </div> -->
